[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nyatodo"
version = "0.1.0"
description = "Personal, keyboard-first task and time-tracking desktop workspace."
readme = "README.md"
license = "MIT"
authors = [{ name = "xKony" }]
requires-python = ">=3.13,<3.15"
dependencies = [
    "PySide6>=6.7,<6.11",
]

[project.scripts]
nyatodo = "nyatodo.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nyatodo"]

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-qt>=4.4",
    "ruff>=0.9",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
warn_unreachable = true
warn_unused_configs = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
qt_api = "pyside6"
